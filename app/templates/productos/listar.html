{% extends "base.html" %}

{% block title %}Productos — Sistema de Facturación{% endblock %}

{% block contenido %}
<div class="flex items-center justify-between mb-6">
    <div>
        <h2 class="text-2xl font-bold text-gray-900">Productos</h2>
        <p class="text-sm text-gray-600">Catálogo de productos e inventario</p>
    </div>
    <a href="{{ url_for('productos.crear') }}"
       class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm">
        + Nuevo producto
    </a>
</div>

<!-- Filtros -->
<div class="bg-white rounded shadow p-4 mb-4 flex flex-wrap items-center gap-3">
    <input type="text" name="q" value="{{ buscar }}"
           placeholder="Buscar por código o nombre..."
           class="flex-1 min-w-[200px] border border-gray-300 rounded px-3 py-2 text-sm"
           hx-get="{{ url_for('productos.listar') }}"
           hx-trigger="keyup changed delay:300ms"
           hx-target="#tabla-productos"
           hx-include="[name='inactivos'],[name='alicuota']"
           hx-push-url="true">

    <select name="alicuota"
            class="border border-gray-300 rounded px-3 py-2 text-sm"
            hx-get="{{ url_for('productos.listar') }}"
            hx-trigger="change"
            hx-target="#tabla-productos"
            hx-include="[name='q'],[name='inactivos']"
            hx-push-url="true">
        <option value="">Todas las alícuotas</option>
        {% for a in alicuotas %}
            <option value="{{ a.id }}" {% if alicuota_id == a.id %}selected{% endif %}>
                {{ a.codigo }} ({{ a.porcentaje }}%)
            </option>
        {% endfor %}
    </select>

    <label class="flex items-center gap-2 text-sm text-gray-700">
        <input type="checkbox" name="inactivos" value="1"
               {% if mostrar_inactivos %}checked{% endif %}
               hx-get="{{ url_for('productos.listar') }}"
               hx-trigger="change"
               hx-target="#tabla-productos"
               hx-include="[name='q'],[name='alicuota']"
               hx-push-url="true">
        Mostrar inactivos
    </label>
</div>

<!-- Tabla + paginación -->
<div id="tabla-productos">
    {% include "productos/_tabla.html" %}
</div>
{% endblock %}
