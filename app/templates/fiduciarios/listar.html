{% extends "base.html" %}

{% block title %}Fiduciarios — Sistema de Facturación{% endblock %}

{% block contenido %}
<div class="flex items-center justify-between mb-6">
    <div>
        <h2 class="text-2xl font-bold text-gray-900">Fiduciarios</h2>
        <p class="text-sm text-gray-600">Terceros financieros (Cashea, seguros, etc.)</p>
    </div>
    <a href="{{ url_for('fiduciarios.crear') }}"
       class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm">
        + Nuevo fiduciario
    </a>
</div>

<div class="bg-white rounded shadow p-4 mb-4 flex flex-wrap items-center gap-3">
    <input type="text" name="q" value="{{ buscar }}"
           placeholder="Buscar por nombre o documento..."
           class="flex-1 min-w-[200px] border border-gray-300 rounded px-3 py-2 text-sm"
           hx-get="{{ url_for('fiduciarios.listar') }}"
           hx-trigger="keyup changed delay:300ms"
           hx-target="#tabla-fiduciarios"
           hx-include="[name='inactivos']"
           hx-push-url="true">

    <label class="flex items-center gap-2 text-sm text-gray-700">
        <input type="checkbox" name="inactivos" value="1"
               {% if mostrar_inactivos %}checked{% endif %}
               hx-get="{{ url_for('fiduciarios.listar') }}"
               hx-trigger="change"
               hx-target="#tabla-fiduciarios"
               hx-include="[name='q']"
               hx-push-url="true">
        Mostrar inactivos
    </label>
</div>

<div id="tabla-fiduciarios">
    {% include "fiduciarios/_tabla.html" %}
</div>
{% endblock %}
