<tr id="fiduciario-{{ f.id }}" class="border-t border-gray-100">
    <td class="px-4 py-2">
        {{ f.tipo_documento }}-{{ f.numero_documento }}
    </td>
    <td class="px-4 py-2 font-medium text-gray-900">{{ f.nombre }}</td>
    <td class="px-4 py-2 text-gray-600 text-xs">{{ f.contacto or "—" }}</td>
    <td class="px-4 py-2 text-gray-600 text-xs">{{ f.telefono or "—" }}</td>
    <td class="px-4 py-2 text-center">
        {% if f.activo %}
            <span class="px-2 py-1 text-xs rounded bg-green-100 text-green-800">Activo</span>
        {% else %}
            <span class="px-2 py-1 text-xs rounded bg-gray-200 text-gray-700">Inactivo</span>
        {% endif %}
    </td>
    <td class="px-4 py-2 text-right">
        <a href="{{ url_for('fiduciarios.editar', fiduciario_id=f.id) }}"
           class="text-blue-600 hover:underline text-xs">Editar</a>

        {% if f.activo %}
            <button hx-post="{{ url_for('fiduciarios.desactivar', fiduciario_id=f.id) }}"
                    hx-target="#fiduciario-{{ f.id }}"
                    hx-swap="outerHTML"
                    hx-confirm="¿Desactivar este fiduciario?"
                    class="ml-3 text-red-600 hover:underline text-xs">
                Desactivar
            </button>
        {% else %}
            <button hx-post="{{ url_for('fiduciarios.activar', fiduciario_id=f.id) }}"
                    hx-target="#fiduciario-{{ f.id }}"
                    hx-swap="outerHTML"
                    class="ml-3 text-green-600 hover:underline text-xs">
                Reactivar
            </button>
        {% endif %}
    </td>
</tr>
